name: Weekly Video Production

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6 AM UTC
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel to produce for (leave empty for all)'
        required: false
        default: ''
      upload:
        description: 'Upload to YouTube'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/youtube-automation-monetization

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      - name: Install Python dependencies
        run: |
          cd youtube-automation
          pip install -r requirements.txt

      - name: Set up credentials
        run: |
          cd youtube-automation
          echo "${{ secrets.YOUTUBE_CLIENT_SECRETS }}" | base64 -d > client_secrets.json
        if: inputs.upload == 'true'

      - name: Run production
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          LLM_PROVIDER: gemini
          TTS_PROVIDER: edge
          IMAGE_PROVIDER: siliconflow
        run: |
          cd youtube-automation
          if [ -n "${{ inputs.channel }}" ]; then
            python main.py run --channel "${{ inputs.channel }}" --no-upload
          else
            python main.py run-all --no-upload
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: produced-videos-${{ github.run_number }}
          path: |
            youtube-automation/storage/videos/*.mp4
            youtube-automation/storage/thumbnails/*.png
            youtube-automation/storage/scripts/*.json
          retention-days: 7

  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/youtube-automation-monetization

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          cd youtube-automation && pip install -r requirements.txt

      - name: Analyze niches
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          cd youtube-automation
          python main.py analyze --lang en
