name: Weekly Niche Analysis

on:
  schedule:
    # Run every Sunday at 3 AM UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      language:
        description: "Language to analyze (en or es)"
        required: false
        default: "en"

env:
  PYTHON_VERSION: "3.11"

jobs:
  analyze:
    name: Analyze Niches
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine language
        id: lang
        run: |
          LANG="${{ github.event.inputs.language }}"
          echo "lang=${LANG:-en}" >> "$GITHUB_OUTPUT"

      - name: Run niche analysis
        run: |
          python main.py analyze --lang ${{ steps.lang.outputs.lang }}

      - name: Upload analysis results
        uses: actions/upload-artifact@v4
        with:
          name: niche-analysis-${{ github.run_id }}
          path: |
            analytics/
            data/
            *.json
            *.csv
          retention-days: 30
          if-no-files-found: warn

      - name: Commit updated niche data (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A analytics/ data/ 2>/dev/null || true
          git diff --cached --quiet && echo "No changes to commit." && exit 0
          git commit -m "chore: refresh niche analysis data [skip ci]"
          git push
