name: Daily Video Production & Upload

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      niche:
        description: "Niche to produce (leave empty for auto-select)"
        required: false
        default: ""
      language:
        description: "Language (en or es)"
        required: false
        default: "en"
      upload:
        description: "Upload to YouTube after production"
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Produce videos locally
  # ---------------------------------------------------------------------------
  produce:
    name: Produce Videos
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_CLOUD_TTS_KEY: ${{ secrets.GOOGLE_CLOUD_TTS_KEY }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            imagemagick \
            fonts-liberation \
            fonts-dejavu-core

      - name: Relax ImageMagick policy (allow PDF/SVG rendering)
        run: |
          sudo sed -i 's/<policy domain="coder" rights="none"/<policy domain="coder" rights="read|write"/g' \
            /etc/ImageMagick-6/policy.xml || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write GCP service account credentials (if provided)
        if: env.GOOGLE_APPLICATION_CREDENTIALS_JSON != ''
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/gcp-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-sa.json" >> "$GITHUB_ENV"

      - name: Build CLI arguments
        id: cli_args
        run: |
          ARGS="--no-upload"
          if [ -n "${{ github.event.inputs.niche }}" ]; then
            ARGS="$ARGS --niche ${{ github.event.inputs.niche }}"
          fi
          if [ -n "${{ github.event.inputs.language }}" ]; then
            ARGS="$ARGS --lang ${{ github.event.inputs.language }}"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Run production pipeline
        run: |
          python main.py run ${{ steps.cli_args.outputs.args }}

      - name: Collect produced videos
        if: always()
        run: |
          mkdir -p /tmp/video-artifacts
          find . -maxdepth 3 \( -name "*.mp4" -o -name "*.mkv" -o -name "*.webm" \) \
            -exec cp {} /tmp/video-artifacts/ \;
          echo "Videos found:"
          ls -lh /tmp/video-artifacts/ || echo "No videos produced."

      - name: Upload video artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: produced-videos
          path: /tmp/video-artifacts/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-logs
          path: |
            *.log
            logs/
            output/
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Job 2: Upload to YouTube (runs only after successful production)
  # ---------------------------------------------------------------------------
  upload:
    name: Upload to YouTube
    needs: produce
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only run upload when explicitly requested via workflow_dispatch
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.event.inputs.upload == 'true'

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download produced videos
        uses: actions/download-artifact@v4
        with:
          name: produced-videos
          path: output/videos/

      - name: Decode YouTube client secrets
        run: |
          echo "${{ secrets.YOUTUBE_CLIENT_SECRETS }}" | base64 -d > client_secrets.json

      - name: Restore YouTube OAuth token (if cached)
        uses: actions/cache@v4
        with:
          path: token.json
          key: youtube-oauth-token-${{ github.repository }}

      - name: Upload videos to YouTube
        env:
          YOUTUBE_CLIENT_SECRETS: client_secrets.json
        run: |
          python main.py produce --no-upload 2>/dev/null || true
          # Use the uploader module directly for already-produced videos
          python -c "
          from uploader.youtube_uploader import YouTubeUploader
          import glob, os

          uploader = YouTubeUploader()
          videos = glob.glob('output/videos/*.mp4')
          for v in videos:
              print(f'Uploading: {v}')
              try:
                  result = uploader.upload(v)
                  print(f'  -> {result}')
              except Exception as e:
                  print(f'  -> FAILED: {e}')
          "

      - name: Save YouTube OAuth token to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: token.json
          key: youtube-oauth-token-${{ github.repository }}
